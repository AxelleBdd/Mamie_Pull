[tool.ruff]
line-length = 88
target-version = "py311"
exclude = ["config/settings.py", "**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["app", "users", "news", "favorites", "categories", "products"]