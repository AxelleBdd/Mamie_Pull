name: Frontend CI

on:
    push:
        branches: [main]
        paths:
            - 'frontend/**'
    pull_request:
            branches: [main]
            paths:
                - 'frontend/**'

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6

            - name: Set up Node.js
              uses: actions/setup-node@v3
              with:
                node-version: '20'
                cache: 'npm'
                cache-dependency-path: frontend/package-lock.json

            - name: Install dependencies
              run: npm ci
              working-directory: frontend

            - name: Run tests
              run: npm test
              working-directory: frontend